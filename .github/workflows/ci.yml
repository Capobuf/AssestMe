name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=1G
          tools: composer:v2
      - name: Install Unit test runtime
        run: sudo apt-get update && sudo apt-get install --yes weasyprint
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run pre-commit check
        run: scripts/check.sh
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  application:
    name: Application / MariaDB 12.3.3
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASSESTME_TEST_DB_DATABASE: assestme_test
      ASSESTME_TEST_DB_DRIVER: mariadb
      ASSESTME_TEST_DB_HOST: 127.0.0.1
      ASSESTME_TEST_DB_PASSWORD: assestme-ci-database
      ASSESTME_TEST_DB_PORT: 3306
      ASSESTME_TEST_DB_USERNAME: root
      LARAVEL_PDF_DRIVER: weasyprint
      LARAVEL_PDF_WEASYPRINT_BINARY: /usr/bin/weasyprint
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_DATABASE: assestme_test
          MARIADB_ROOT_PASSWORD: assestme-ci-database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=1G
          tools: composer:v2
      - name: Install application test runtimes
        run: sudo apt-get update && sudo apt-get install --yes gdb mariadb-client poppler-utils weasyprint
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install matching ChromeDriver
        run: php artisan dusk:chrome-driver --detect
      - name: Prepare application diagnostics root
        run: |
          mkdir -p "${RUNNER_TEMP}/application-tests/storage/logs" "${RUNNER_TEMP}/php-cores"
          touch "${RUNNER_TEMP}/application-tests/.assestme-test-root"
          sudo sysctl -w "kernel.core_pattern=${RUNNER_TEMP}/php-cores/core.%p"
          {
            php -v
            php --ini
            php -m
            php -r 'foreach (["memory_limit", "opcache.enable", "opcache.enable_cli", "opcache.jit", "opcache.jit_buffer_size", "opcache.file_cache", "opcache.validate_timestamps", "opcache.file_update_protection"] as $key) { echo $key, "=", ini_get($key), PHP_EOL; }'
          } > "${RUNNER_TEMP}/application-tests/storage/logs/php-runtime.log"
      - name: Run canonical application suite
        env:
          ASSESTME_TEST_ISOLATED: '1'
          ASSESTME_TEST_ROOT: ${{ runner.temp }}/application-tests
        run: |
          ulimit -c unlimited
          scripts/test-app.sh
      - name: Collect native PHP crash backtrace
        if: failure()
        run: |
          shopt -s nullglob
          for core_path in "${RUNNER_TEMP}"/php-cores/core.*; do
            gdb --batch \
              -ex 'set debuginfod enabled off' \
              -ex 'set print frame-arguments none' \
              -ex 'thread apply all bt' \
              -ex 'info sharedlibrary' \
              "$(command -v php)" "$core_path" \
              > "${RUNNER_TEMP}/application-tests/storage/logs/php-native-$(basename "$core_path").log" 2>&1
          done
      - name: Upload application browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: application-browser-diagnostics
          path: |
            ${{ runner.temp }}/application-tests/storage/logs/*.log
            tests/Browser/screenshots
            tests/Browser/source
            tests/Browser/console
          if-no-files-found: ignore
          retention-days: 7

  installer:
    name: Release installer / MariaDB 12.3.3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_DATABASE: assestme_test
          MARIADB_ROOT_PASSWORD: assestme-ci-database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: none, bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo, pdo_mysql, pdo_sqlite, phar, session, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          ini-values: memory_limit=512M
          tools: composer:v2
      - name: Install release and installer runtimes
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client rsync unzip weasyprint
      - name: Resolve runtime binaries
        run: |
          weasyprint_binary="$(command -v weasyprint)"
          test -n "$weasyprint_binary"
          test -x "$weasyprint_binary"
          echo "LARAVEL_PDF_WEASYPRINT_BINARY=$weasyprint_binary" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build current release archive once
        run: scripts/build-release.sh ci "${RUNNER_TEMP}/release"
      - name: Validate archive integrity and extract release
        run: |
          archive_path="${RUNNER_TEMP}/release/assestme-ci.zip"
          extraction_root="${RUNNER_TEMP}/validated-release"
          test -s "$archive_path"
          unzip -tq "$archive_path"
          mkdir "$extraction_root"
          unzip -q "$archive_path" -d "$extraction_root"
          release_path="${extraction_root}/assestme"
          test ! -e "$release_path/.env"
          test ! -e "$release_path/.env.pending"
          test ! -e "$release_path/storage/app/private/installed.lock"
          test ! -e "$release_path/storage/framework/installer/state.enc"
          test -f "$release_path/artisan"
          test -f "$release_path/vendor/autoload.php"
          test -f "$release_path/resources/views/installation/database.blade.php"
          test -s "$release_path/RELEASE-MANIFEST.sha256"
          cd "$release_path"
          sha256sum --check RELEASE-MANIFEST.sha256
      - name: Install matching ChromeDriver
        run: php artisan dusk:chrome-driver --detect
      - name: Prepare release acceptance diagnostics root
        run: mkdir -p "${RUNNER_TEMP}/release-installer" && touch "${RUNNER_TEMP}/release-installer/.assestme-test-root"
      - name: Complete canonical extracted-release installer journey
        env:
          ASSESTME_DUSK_DATABASE_HOST: 127.0.0.1
          ASSESTME_DUSK_DATABASE_PORT: 3306
          ASSESTME_DUSK_DATABASE_NAME: assestme_test
          ASSESTME_DUSK_DATABASE_USERNAME: root
          ASSESTME_DUSK_DATABASE_PASSWORD: assestme-ci-database
          ASSESTME_TEST_ROOT: ${{ runner.temp }}/release-installer
        run: scripts/release-installer-acceptance.sh "${RUNNER_TEMP}/validated-release/assestme"
      - name: Upload release installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-installer-diagnostics
          path: |
            ${{ runner.temp }}/release-installer/storage/logs/release-server.log
            ${{ runner.temp }}/validated-release/assestme/storage/logs/laravel.log
            tests/Browser/screenshots
            tests/Browser/source
            tests/Browser/console
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated installable release
        uses: actions/upload-artifact@v6
        with:
          name: assestme-ci-release
          path: ${{ runner.temp }}/release/assestme-ci.zip
          if-no-files-found: error
          retention-days: 7

  compatibility-smoke:
    name: Compatibility smoke / SQLite and MySQL 8.4.11
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: assestme_test
          MYSQL_ROOT_PASSWORD: assestme-ci-database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=assestme-ci-database"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=512M
          tools: composer:v2
      - name: Install compatibility runtimes
        run: sudo apt-get update && sudo apt-get install --yes default-mysql-client weasyprint
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run SQLite compatibility smoke
        run: |
          source scripts/isolated-environment.sh
          assestme_prepare_isolated_environment_file "$GITHUB_WORKSPACE"
          trap assestme_cleanup_isolated_environment_file EXIT
          php artisan test tests/Feature/SeedDataTest.php tests/Feature/ServerDatabaseCapabilityTest.php
      - name: Run MySQL compatibility smoke
        env:
          ASSESTME_TEST_DB_DATABASE: assestme_test
          ASSESTME_TEST_DB_DRIVER: mysql
          ASSESTME_TEST_DB_HOST: 127.0.0.1
          ASSESTME_TEST_DB_PASSWORD: assestme-ci-database
          ASSESTME_TEST_DB_PORT: 3306
          ASSESTME_TEST_DB_USERNAME: root
        run: |
          source scripts/isolated-environment.sh
          assestme_prepare_isolated_environment_file "$GITHUB_WORKSPACE"
          trap assestme_cleanup_isolated_environment_file EXIT
          php artisan test tests/Feature/SeedDataTest.php tests/Feature/ServerDatabaseCapabilityTest.php

  publish-develop-release:
    name: Publish develop release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [check, application, installer, compatibility-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: assestme-develop-release
      cancel-in-progress: true
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download validated release artifact
        uses: actions/download-artifact@v7
        with:
          name: assestme-ci-release
          path: dist
      - name: Prepare stable develop asset
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/assestme-ci.zip
          install -m 0644 dist/assestme-ci.zip dist/assestme-develop.zip
          test -s dist/assestme-develop.zip
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [[ "${#archives[@]}" -ne 2 ]]; then
              printf 'Expected the CI archive and the renamed develop archive, found %s.\n' "${#archives[@]}" >&2
              printf '%s\n' "${archives[@]}" >&2
              exit 1
          fi
          if find dist -type f -name '*.sha256' -print -quit | grep -q .; then
              printf 'Unexpected external SHA-256 sidecar found in the release artifact.\n' >&2
              find dist -type f -name '*.sha256' -print >&2
              exit 1
          fi
      - name: Confirm this is still the latest develop commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin develop
          latest_develop_sha="$(git rev-parse origin/develop)"
          if [[ "$GITHUB_SHA" != "$latest_develop_sha" ]]; then
              printf 'Refusing to publish obsolete commit %s; develop is now %s.\n' "$GITHUB_SHA" "$latest_develop_sha" >&2
              exit 1
          fi
      - name: Publish rolling develop prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_tag='develop-latest'
          release_title='AssestMe develop — ultima build valida'
          release_asset='dist/assestme-develop.zip'
          short_sha="${GITHUB_SHA:0:7}"
          cat > release-notes.md <<EOF
          Build automatica validata del branch \`develop\`.

          - Commit: \`${GITHUB_SHA}\`
          - Commit breve: \`${short_sha}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Il file \`assestme-develop.zip\` è il pacchetto installabile prodotto e verificato dal job \`installer\`.

          Questa è una prerelease di sviluppo. Non sostituisce una release stabile versionata.
          EOF
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$release_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}"
          fi
          gh release create "$release_tag" "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file release-notes.md \
              --prerelease

  deploy_cloudpanel:
    name: Deploy CloudPanel CI
    needs: [publish-develop-release]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: assestme-cloudpanel-ci
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CLOUDPANEL_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY" || {
            echo "CLOUDPANEL_SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          }
          test -n "$SSH_KNOWN_HOSTS" || {
            echo "CLOUDPANEL_KNOWN_HOSTS is not configured." >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cloudpanel_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cloudpanel_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy develop to CloudPanel
        shell: bash
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDPANEL_HOST" || {
            echo "CLOUDPANEL_HOST is not configured." >&2
            exit 1
          }
          test -n "$CLOUDPANEL_PORT" || {
            echo "CLOUDPANEL_PORT is not configured." >&2
            exit 1
          }
          test -n "$CLOUDPANEL_USER" || {
            echo "CLOUDPANEL_USER is not configured." >&2
            exit 1
          }
          ssh \
            -p "$CLOUDPANEL_PORT" \
            -i "$HOME/.ssh/cloudpanel_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$CLOUDPANEL_USER@$CLOUDPANEL_HOST"
