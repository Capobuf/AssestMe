name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_FALLBACK_LOCALE: it
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_LOCALE: it
      APP_TIMEZONE: Europe/Rome
      APP_URL: http://127.0.0.1:8000
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LARAVEL_PDF_DRIVER: weasyprint
      LARAVEL_PDF_WEASYPRINT_BINARY: /usr/bin/weasyprint

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start pinned verification and browser-test infrastructure
        run: docker compose -f docker/compose.dev.yml --profile browser up --build --detach --wait app selenium

      - name: Run isolated quality gates in the normative runtime
        run: >-
          docker compose -f docker/compose.dev.yml --profile browser exec -T
          -e RUN_DUSK=0 app scripts/verify.sh

      - name: Prepare inspectable browser-test root
        run: |
          docker compose -f docker/compose.dev.yml --profile browser exec -T app \
            sh -c 'mkdir -p /tmp/assestme-ci-dusk && touch /tmp/assestme-ci-dusk/.assestme-test-root'

      - name: Run isolated Dusk suite
        run: |
          docker compose -f docker/compose.dev.yml --profile browser exec -T \
            -e ASSESTME_TEST_ROOT=/tmp/assestme-ci-dusk \
            -e ASSESTME_TEST_ISOLATED=1 \
            -e ASSESTME_FIC_DUSK_FAKE=1 \
            app scripts/dusk-isolated.sh

      - name: Stop pinned browser-test infrastructure
        if: always()
        run: |
          container_id="$(docker compose -f docker/compose.dev.yml --profile browser ps --quiet app)"
          if [[ -n "$container_id" ]] && docker compose -f docker/compose.dev.yml --profile browser exec -T app \
              test -d /tmp/assestme-ci-dusk/storage/logs; then
            mkdir -p storage/framework/assestme-ci-dusk/storage/logs
            docker cp "${container_id}:/tmp/assestme-ci-dusk/storage/logs/." \
              storage/framework/assestme-ci-dusk/storage/logs
          fi
          docker compose -f docker/compose.dev.yml --profile browser down --remove-orphans

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: assestme-failure-artifacts
          path: |
            storage/logs/*.log
            storage/framework/assestme-ci-dusk/storage/logs/*.log
            tests/Browser/screenshots
            tests/Browser/console
          if-no-files-found: ignore

  database-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql-8.0.46
            driver: mysql
            image: mysql:8.0.46
            client_package: default-mysql-client
            health_cmd: mysqladmin ping --host=127.0.0.1 --password=assestme-ci-database
            full_suite: false
          - name: mysql-8.4.11
            driver: mysql
            image: mysql:8.4.11
            client_package: default-mysql-client
            health_cmd: mysqladmin ping --host=127.0.0.1 --password=assestme-ci-database
            full_suite: true
          - name: mariadb-11.8.6
            driver: mariadb
            image: mariadb:11.8.6
            client_package: mariadb-client
            health_cmd: healthcheck.sh --connect --innodb_initialized
            full_suite: false
          - name: mariadb-12.3.2
            driver: mariadb
            image: mariadb:12.3.2
            client_package: mariadb-client
            health_cmd: healthcheck.sh --connect --innodb_initialized
            full_suite: true
    name: Database / ${{ matrix.name }}
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ASSESTME_TEST_DB_DATABASE: assestme_test
      ASSESTME_TEST_DB_DRIVER: ${{ matrix.driver }}
      ASSESTME_TEST_DB_HOST: 127.0.0.1
      ASSESTME_TEST_DB_PASSWORD: assestme-ci-database
      ASSESTME_TEST_DB_PORT: 3306
      ASSESTME_TEST_DB_USERNAME: root
      LARAVEL_PDF_DRIVER: weasyprint
      LARAVEL_PDF_WEASYPRINT_BINARY: /usr/bin/weasyprint
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: assestme_test
          MYSQL_ROOT_PASSWORD: assestme-ci-database
          MARIADB_DATABASE: assestme_test
          MARIADB_ROOT_PASSWORD: assestme-ci-database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=512M
          tools: composer:v2

      - name: Install database clients and WeasyPrint
        run: sudo apt-get update && sudo apt-get install --yes "${{ matrix.client_package }}" weasyprint

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run migrations, seeders, and real capability probe
        run: php artisan test tests/Feature/SeedDataTest.php tests/Feature/ServerDatabaseCapabilityTest.php

      - name: Run common functional database suite on recent servers
        if: matrix.full_suite
        run: >-
          php artisan test
          tests/Feature/ClientSiteFoundationTest.php
          tests/Feature/AssetFoundationTest.php
          tests/Feature/RiskEffortFoundationTest.php
          tests/Feature/FindingTemplateCrudTest.php
          tests/Feature/AssessmentDomainTest.php
          tests/Feature/EvidenceTest.php
          tests/Feature/WorkspacePageTest.php
          tests/Feature/TemplateImportExportTest.php

      - name: Run driver-aware integrity regressions
        run: php artisan test tests/Unit/DatabaseIntegrityCheckTest.php

      - name: Run SQLite diagnostic regressions
        env:
          ASSESTME_TEST_DB_DRIVER: sqlite
        run: php artisan test tests/Feature/DiagnoseCommandTest.php

      - name: Select product-authentic dump and restore clients
        run: |
          if [[ "${{ matrix.driver }}" = "mysql" ]]; then
            client_root="${RUNNER_TEMP}/mysql-client"
            mkdir -p "$client_root"
            container_id="$(docker ps --filter "ancestor=${{ matrix.image }}" --format '{{.ID}}' | head -n 1)"
            test -n "$container_id"
            docker cp "${container_id}:/usr/bin/mysqldump" "$client_root/mysqldump"
            docker cp "${container_id}:/usr/bin/mysql" "$client_root/mysql"
            chmod 0700 "$client_root/mysqldump" "$client_root/mysql"
            "$client_root/mysqldump" --version
            "$client_root/mysql" --version
            echo "ASSESTME_DB_DUMP_BINARY=$client_root/mysqldump" >> "$GITHUB_ENV"
            echo "ASSESTME_DB_RESTORE_BINARY=$client_root/mysql" >> "$GITHUB_ENV"
            echo "$client_root" >> "$GITHUB_PATH"
          else
            /usr/bin/mariadb-dump --version
            /usr/bin/mariadb --version
            echo 'ASSESTME_DB_DUMP_BINARY=/usr/bin/mariadb-dump' >> "$GITHUB_ENV"
            echo 'ASSESTME_DB_RESTORE_BINARY=/usr/bin/mariadb' >> "$GITHUB_ENV"
          fi

      - name: Run real dump restore private-storage and safety-backup round trip
        run: php artisan test tests/Unit/ServerDatabaseBackupRestoreTest.php

  cloudpanel-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=512M
          tools: composer:v2

      - name: Install release build and runtime tools
        run: sudo apt-get update && sudo apt-get install --yes rsync unzip weasyprint

      - name: Require built-in process diagnostics
        run: |
          command -v ss
          command -v strace
          ss --version
          strace --version | head -n 1

      - name: Resolve runtime binaries
        run: |
          weasyprint_binary="$(command -v weasyprint)"
          test -n "$weasyprint_binary"
          test -x "$weasyprint_binary"
          echo "LARAVEL_PDF_WEASYPRINT_BINARY=$weasyprint_binary" >> "$GITHUB_ENV"

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build CloudPanel archive
        run: scripts/build-cloudpanel-release.sh ci "${RUNNER_TEMP}/release"

      - name: Build known-good CloudPanel archive from the historical commit
        env:
          KNOWN_GOOD_COMMIT: c8bfab866bed902b606dc75c1685cdcbf4c64c79
        run: |
          known_good_source="${RUNNER_TEMP}/source-known-good"
          git worktree add --detach "$known_good_source" "$KNOWN_GOOD_COMMIT"
          cd "$known_good_source"
          test "$(git rev-parse HEAD)" = "$KNOWN_GOOD_COMMIT"
          composer install --no-interaction --prefer-dist --no-progress
          scripts/build-cloudpanel-release.sh c8bfab8 "${RUNNER_TEMP}/release-known-good"

      - name: Validate archive contents
        run: |
          validate_archive() {
            archive_path="$1"
            extraction_root="$2"
            mkdir "$extraction_root"
            unzip -q "$archive_path" -d "$extraction_root"
            release_path="${extraction_root}/assestme"
            test ! -e "$release_path/.env"
            test -f "$release_path/vendor/autoload.php"
            test -f "$release_path/RELEASE-MANIFEST.sha256"
            cd "$release_path"
            sha256sum --check RELEASE-MANIFEST.sha256
          }

          validate_archive \
            "${RUNNER_TEMP}/release-known-good/assestme-c8bfab8.zip" \
            "${RUNNER_TEMP}/validated-known-good"
          validate_archive \
            "${RUNNER_TEMP}/release/assestme-ci.zip" \
            "${RUNNER_TEMP}/validated-current"

      - name: Verify the historical and current installer HTTP contracts
        run: |
          expected_routes="$(mktemp)"
          for route in \
            'GET|HEAD install installation.welcome' \
            'POST install/welcome installation.welcome.continue' \
            'GET|HEAD install/requirements installation.runtime' \
            'POST install/requirements installation.runtime.continue' \
            'GET|HEAD install/configuration installation.configuration' \
            'POST install/configuration installation.configuration.store' \
            'GET|HEAD install/database installation.database' \
            'POST install/database installation.database.store' \
            'GET|HEAD install/administrator installation.administrator' \
            'POST install/finalize installation.finalize'; do
            echo "$route" >> "$expected_routes"
          done

          for release_path in \
            "${RUNNER_TEMP}/validated-known-good/assestme" \
            "${RUNNER_TEMP}/validated-current/assestme"; do
            actual_routes="$(mktemp)"
            (
              cd "$release_path"
              php artisan route:list --json --path=install
            ) | jq -r '.[] | [.method, .uri, .name] | join(" ")' > "$actual_routes"

            while read -r expected_route; do
              grep -Fx "$expected_route" "$actual_routes"
            done < "$expected_routes"

            for field in application_url timezone backup_root database_driver sqlite_path name email password password_confirmation; do
              rg -q "name=.[{(]?[[:space:]]*['\"]$field['\"]|name=['\"]$field['\"]" \
                "$release_path/resources/views/installation"
            done
          done

          echo 'RELEASE_INSTALLER_HARNESS_CONTRACT=compatible'

      - name: Install matching ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Prepare independent extracted releases
        run: |
          extraction_root="${RUNNER_TEMP}/release-dusk"
          mkdir "$extraction_root"
          unzip -q "${RUNNER_TEMP}/release/assestme-ci.zip" -d "$extraction_root"
          release_path="${extraction_root}/assestme"
          test ! -e "$release_path/.env"
          test ! -e "$release_path/.env.pending"
          test ! -e "$release_path/storage/app/private/installed.lock"
          test ! -e "$release_path/storage/framework/installer/state.enc"
          test ! -e "$release_path/storage/app/database/database.sqlite"

      - name: Run known-good extracted-release installer over HTTP
        id: known-good-http-smoke
        continue-on-error: true
        run: |
          extraction_root="${RUNNER_TEMP}/http-known-good"
          mkdir "$extraction_root"
          unzip -q "${RUNNER_TEMP}/release-known-good/assestme-c8bfab8.zip" -d "$extraction_root"
          set +e
          scripts/ci-install-release-sqlite.sh "$extraction_root/assestme" 8124 known-good \
            2>&1 | tee "${RUNNER_TEMP}/known-good-http.log"
          smoke_exit_code="${PIPESTATUS[0]}"
          set -e
          if [[ "$smoke_exit_code" -eq 0 ]]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            echo "KNOWN_GOOD_HTTP_SMOKE_RESULT=PASS"
          else
            echo 'result=FAIL' >> "$GITHUB_OUTPUT"
            echo "KNOWN_GOOD_HTTP_SMOKE_RESULT=FAIL"
            echo "KNOWN_GOOD_HTTP_SMOKE_EXIT_CODE=$smoke_exit_code"
            exit "$smoke_exit_code"
          fi

      - name: Run current extracted-release installer over HTTP
        id: current-http-smoke
        continue-on-error: true
        run: |
          extraction_root="${RUNNER_TEMP}/http-current-1"
          mkdir "$extraction_root"
          unzip -q "${RUNNER_TEMP}/release/assestme-ci.zip" -d "$extraction_root"
          set +e
          scripts/ci-install-release-sqlite.sh "$extraction_root/assestme" 8125 current-1 \
            2>&1 | tee "${RUNNER_TEMP}/current-http-1.log"
          smoke_exit_code="${PIPESTATUS[0]}"
          set -e
          if [[ "$smoke_exit_code" -eq 0 ]]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            echo "CURRENT_HTTP_SMOKE_RESULT=PASS"
          else
            echo 'result=FAIL' >> "$GITHUB_OUTPUT"
            echo "CURRENT_HTTP_SMOKE_RESULT=FAIL"
            echo "CURRENT_HTTP_SMOKE_EXIT_CODE=$smoke_exit_code"
            exit "$smoke_exit_code"
          fi

      - name: Repeat a passing current HTTP smoke twice with fresh state
        id: current-http-repeat
        if: steps.current-http-smoke.outputs.result == 'PASS'
        continue-on-error: true
        run: |
          repeated_result=PASS
          for attempt in 2 3; do
            extraction_root="${RUNNER_TEMP}/http-current-${attempt}"
            mkdir "$extraction_root"
            unzip -q "${RUNNER_TEMP}/release/assestme-ci.zip" -d "$extraction_root"
            set +e
            scripts/ci-install-release-sqlite.sh "$extraction_root/assestme" "$((8124 + attempt))" "current-${attempt}" \
              2>&1 | tee "${RUNNER_TEMP}/current-http-${attempt}.log"
            smoke_exit_code="${PIPESTATUS[0]}"
            set -e
            if [[ "$smoke_exit_code" -ne 0 ]]; then
              repeated_result=INTERMITTENT
              break
            fi
          done
          echo "result=$repeated_result" >> "$GITHUB_OUTPUT"
          echo "CURRENT_HTTP_REPEAT_RESULT=$repeated_result"
          test "$repeated_result" = PASS

      - name: Build the first known-failing boundary release
        if: steps.known-good-http-smoke.outputs.result == 'PASS' && steps.current-http-smoke.outputs.result == 'FAIL'
        env:
          BOUNDARY_COMMIT: d02539c4acd7beb258d5177af434070704d016ad
        run: |
          boundary_source="${RUNNER_TEMP}/source-boundary"
          git worktree add --detach "$boundary_source" "$BOUNDARY_COMMIT"
          cd "$boundary_source"
          test "$(git rev-parse HEAD)" = "$BOUNDARY_COMMIT"
          composer install --no-interaction --prefer-dist --no-progress
          scripts/build-cloudpanel-release.sh d02539 "${RUNNER_TEMP}/release-boundary"

      - name: Run the first known-failing boundary release over HTTP
        id: boundary-http-smoke
        if: steps.known-good-http-smoke.outputs.result == 'PASS' && steps.current-http-smoke.outputs.result == 'FAIL'
        continue-on-error: true
        run: |
          extraction_root="${RUNNER_TEMP}/http-boundary"
          mkdir "$extraction_root"
          unzip -q "${RUNNER_TEMP}/release-boundary/assestme-d02539.zip" -d "$extraction_root"
          set +e
          scripts/ci-install-release-sqlite.sh "$extraction_root/assestme" 8126 boundary-d02539 \
            2>&1 | tee "${RUNNER_TEMP}/boundary-http.log"
          smoke_exit_code="${PIPESTATUS[0]}"
          set -e
          if [[ "$smoke_exit_code" -eq 0 ]]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            echo 'BOUNDARY_HTTP_SMOKE_RESULT=PASS'
          else
            echo 'result=FAIL' >> "$GITHUB_OUTPUT"
            echo "BOUNDARY_HTTP_SMOKE_RESULT=FAIL"
            echo "BOUNDARY_HTTP_SMOKE_EXIT_CODE=$smoke_exit_code"
            exit "$smoke_exit_code"
          fi

      - name: Complete the extracted-release SQLite installer in a browser
        id: release-dusk
        continue-on-error: true
        run: |
          release_path="${RUNNER_TEMP}/release-dusk/assestme"
          test_root="$(mktemp -d "${RUNNER_TEMP}/assestme-release-dusk.XXXXXXXX")"
          touch "${test_root}/.assestme-test-root"
          mkdir -p "${test_root}/storage/logs"
          administrator_password="CI!$(php -r 'echo bin2hex(random_bytes(14));')aA1"
          trace_root="$(mktemp -d)"
          trace_prefix="${trace_root}/process"
          tracer_pid=''
          supervisor_pid=''
          listener_pid=''

          process_status() {
            process_stat="$(ps -o stat= -p "$1" 2>/dev/null | awk '{$1=$1; print}' || true)"
            if [[ -z "$process_stat" ]]; then
              echo dead
            elif [[ "$process_stat" == Z* ]]; then
              echo zombie
            else
              echo alive
            fi
          }

          listener_for_port() {
            ss -H -ltnp 'sport = :8123' 2>/dev/null \
              | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' \
              | head -n 1
          }

          trace_exit_record() {
            role="$1"
            pid="$2"
            trace_file="${trace_prefix}.${pid}"
            exit_line="$(grep -E '\+\+\+ (exited with [0-9]+|killed by SIG[A-Z0-9]+[^+]*) \+\+\+' "$trace_file" 2>/dev/null | tail -n 1 || true)"
            exit_code=unavailable
            signal=none
            signal_name=none

            if [[ "$exit_line" =~ \+\+\+\ exited\ with\ ([0-9]+)\ \+\+\+ ]]; then
              exit_code="${BASH_REMATCH[1]}"
            elif [[ "$exit_line" =~ \+\+\+\ killed\ by\ (SIG[A-Z0-9]+) ]]; then
              signal_name="${BASH_REMATCH[1]}"
              signal="$(kill -l "$signal_name" 2>/dev/null || true)"
              if [[ "$signal" =~ ^[0-9]+$ ]]; then
                exit_code="$((128 + signal))"
              else
                signal=unknown
              fi
            elif [[ "$(process_status "$pid")" = alive ]]; then
              exit_code=still-running
            fi

            echo "RELEASE_${role}_EXIT_CODE=$exit_code"
            echo "RELEASE_${role}_SIGNAL=$signal"
            echo "RELEASE_${role}_SIGNAL_NAME=$signal_name"
            echo "RELEASE_${role}_EXIT_SOURCE=strace"
          }

          release_server_snapshot() {
            phase="$1"
            current_owner="$(listener_for_port || true)"
            echo "RELEASE_DIAGNOSTIC_PHASE=$phase"
            echo "RELEASE_SERVER_SUPERVISOR_PID=$supervisor_pid"
            echo "RELEASE_SERVER_LISTENER_PID=$listener_pid"
            echo "RELEASE_SERVER_SUPERVISOR_STATUS=$(process_status "$supervisor_pid")"
            echo "RELEASE_SERVER_LISTENER_STATUS=$(process_status "$listener_pid")"
            if [[ -n "$current_owner" ]]; then
              echo 'RELEASE_SERVER_PORT_8123_LISTEN=yes'
              echo "RELEASE_SERVER_PORT_8123_OWNER_PID=$current_owner"
            else
              echo 'RELEASE_SERVER_PORT_8123_LISTEN=no'
              echo 'RELEASE_SERVER_PORT_8123_OWNER_PID=none'
            fi

            echo 'RELEASE_SERVER_PROCESS_TREE_BEGIN'
            echo 'PID PPID STAT COMMAND ARGS'
            process_ids="${supervisor_pid},${listener_pid}"
            direct_children="$(pgrep -P "$listener_pid" 2>/dev/null | paste -sd, - || true)"
            if [[ -n "$direct_children" ]]; then
              process_ids+=",${direct_children}"
            fi
            ps -o pid=,ppid=,stat=,comm=,args= -p "$process_ids" 2>/dev/null || true
            echo 'RELEASE_SERVER_PROCESS_TREE_END'

            for state_path in \
              .env \
              .env.pending \
              storage/app/private/installed.lock \
              storage/framework/installer/state.enc; do
              state_label="$(printf '%s' "$state_path" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')"
              if [[ -e "$release_path/$state_path" ]]; then
                echo "RELEASE_${state_label}=present"
              else
                echo "RELEASE_${state_label}=absent"
              fi
            done
          }

          diagnose_release_server() {
            release_server_snapshot AFTER_FAILURE
            sleep 2
            release_server_snapshot AFTER_FAILURE_DELAY
            trace_exit_record LISTENER "$listener_pid"
            trace_exit_record SUPERVISOR "$supervisor_pid"
            echo "RELEASE_SERVER_LOG_TAIL_BEGIN"
            tail -n 120 "${test_root}/storage/logs/release-server.log" 2>/dev/null || true
            echo "RELEASE_SERVER_LOG_TAIL_END"

            if [[ -f "$release_path/storage/logs/laravel.log" ]]; then
              last_finalize_marker="$(
                grep -o 'installer\.finalize\.[a-z_.]*' "$release_path/storage/logs/laravel.log" \
                  | tail -n 1 \
                  || true
              )"
              echo "LAST_FINALIZE_MARKER=${last_finalize_marker:-none}"
              echo "RELEASE_LARAVEL_LOG_TAIL_BEGIN"
              tail -n 200 "$release_path/storage/logs/laravel.log"
              echo "RELEASE_LARAVEL_LOG_TAIL_END"
            else
              echo "LAST_FINALIZE_MARKER=none"
              echo "RELEASE_LARAVEL_LOG=absent"
            fi
          }

          cleanup_release_server() {
            kill "$supervisor_pid" >/dev/null 2>&1 || true
            if [[ -n "$listener_pid" \
              && "$(process_status "$listener_pid")" = alive \
              && "$(ps -o ppid= -p "$listener_pid" 2>/dev/null | awk '{$1=$1; print}')" = "$supervisor_pid" ]]; then
              kill "$listener_pid" >/dev/null 2>&1 || true
            fi
            kill "$tracer_pid" >/dev/null 2>&1 || true
            wait "$tracer_pid" >/dev/null 2>&1 || true
            find "$trace_root" -depth -delete
          }

          (
            cd "$release_path"
            exec strace -ff -e trace=process -o "$trace_prefix" env \
              APP_ENV=testing \
              APP_URL=http://127.0.0.1:8123 \
              php artisan serve --no-reload --host=127.0.0.1 --port=8123
          ) >"${test_root}/storage/logs/release-server.log" 2>&1 &
          tracer_pid="$!"
          trap cleanup_release_server EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8123/install >/dev/null; then
              break
            fi
            sleep 1
          done
          listener_pid="$(listener_for_port)"
          test -n "$listener_pid"
          supervisor_pid="$(ps -o ppid= -p "$listener_pid" | awk '{$1=$1; print}')"
          test -n "$supervisor_pid"
          ps -o args= -p "$supervisor_pid" | grep -F 'artisan serve'
          echo "RELEASE_SERVER_TRACER_PID=$tracer_pid"
          echo "RELEASE_SERVER_SUPERVISOR_PID=$supervisor_pid"
          echo "RELEASE_SERVER_LISTENER_PID=$listener_pid"
          release_server_snapshot BEFORE_DUSK
          set +e
          APP_URL=http://127.0.0.1:8123 \
          ASSESTME_DUSK_ADMIN_PASSWORD="$administrator_password" \
          ASSESTME_DUSK_INSTALLER=1 \
          ASSESTME_RELEASE_PATH="$release_path" \
          ASSESTME_TEST_ISOLATED=1 \
          ASSESTME_TEST_ROOT="$test_root" \
          php artisan dusk --without-tty tests/Browser/CloudPanelInstallationTest.php
          dusk_exit_code="$?"
          set -e

          if [[ "$dusk_exit_code" -ne 0 ]]; then
            echo "RELEASE_DUSK_RESULT=FAIL"
            echo "RELEASE_DUSK_EXIT_CODE=$dusk_exit_code"
            diagnose_release_server
            exit "$dusk_exit_code"
          fi

          echo "RELEASE_DUSK_RESULT=PASS"
          release_server_snapshot AFTER_DUSK
          trace_exit_record LISTENER "$listener_pid"
          trace_exit_record SUPERVISOR "$supervisor_pid"
          test -f "$release_path/.env"
          test -f "$release_path/storage/app/private/installed.lock"
          cd "$release_path"
          env -u DB_CONNECTION -u DB_DATABASE -u ASSESTME_BACKUP_ROOT \
            php artisan schedule:run
          env -u DB_CONNECTION -u DB_DATABASE -u ASSESTME_BACKUP_ROOT \
            php artisan assestme:diagnose --json

      - name: Summarize the historical HTTP comparison
        if: always()
        env:
          KNOWN_RESULT: ${{ steps.known-good-http-smoke.outputs.result }}
          CURRENT_INITIAL_RESULT: ${{ steps.current-http-smoke.outputs.result }}
          CURRENT_REPEAT_RESULT: ${{ steps.current-http-repeat.outputs.result }}
          BOUNDARY_RESULT: ${{ steps.boundary-http-smoke.outputs.result }}
        run: |
          value_from_log() {
            log_path="$1"
            key="$2"
            value="$(grep -F "${key}=" "$log_path" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)"
            printf '%s' "${value:-n/a}"
          }

          current_log="${RUNNER_TEMP}/current-http-1.log"
          if compgen -G "${RUNNER_TEMP}/current-http-*.log" >/dev/null; then
            current_log="$(find "${RUNNER_TEMP}" -maxdepth 1 -name 'current-http-*.log' -print | sort -V | tail -n 1)"
          fi

          current_result="$CURRENT_INITIAL_RESULT"
          if [[ "$CURRENT_INITIAL_RESULT" = PASS && "$CURRENT_REPEAT_RESULT" = PASS ]]; then
            current_result='PASS (3/3)'
          elif [[ "$CURRENT_INITIAL_RESULT" = PASS ]]; then
            current_result=INTERMITTENT
          fi

          known_log="${RUNNER_TEMP}/known-good-http.log"
          boundary_log="${RUNNER_TEMP}/boundary-http.log"
          summary_path="${RUNNER_TEMP}/release-http-summary.md"

          if [[ -f "$boundary_log" ]]; then
            {
              echo '| Check | Known-good c8bfab8 | Current develop | d02539 |'
              echo '| --- | --- | --- | --- |'
              echo "| HTTP smoke | $KNOWN_RESULT | $current_result | $BOUNDARY_RESULT |"
              for spec in \
                'supervisor PID|RELEASE_SERVER_SUPERVISOR_PID' \
                'listener PID|RELEASE_SERVER_LISTENER_PID' \
                'listener exit|RELEASE_LISTENER_EXIT_CODE' \
                'signal|RELEASE_LISTENER_SIGNAL_NAME' \
                'last finalize marker|RELEASE_LAST_FINALIZE_MARKER' \
                '.env.pending|RELEASE__ENV_PENDING' \
                '.env|RELEASE__ENV' \
                'installed.lock|RELEASE_STORAGE_APP_PRIVATE_INSTALLED_LOCK' \
                'PHP version|RELEASE_PHP_VERSION' \
                'SQLite runtime|RELEASE_SQLITE_RUNTIME' \
                'Laravel framework|RELEASE_LARAVEL_FRAMEWORK'; do
                label="${spec%%|*}"
                key="${spec#*|}"
                echo "| $label | $(value_from_log "$known_log" "$key") | $(value_from_log "$current_log" "$key") | $(value_from_log "$boundary_log" "$key") |"
              done
            } > "$summary_path"
          else
            {
              echo '| Check | Known-good c8bfab8 | Current develop |'
              echo '| --- | --- | --- |'
              echo "| HTTP smoke | $KNOWN_RESULT | $current_result |"
              for spec in \
                'supervisor PID|RELEASE_SERVER_SUPERVISOR_PID' \
                'listener PID|RELEASE_SERVER_LISTENER_PID' \
                'listener exit|RELEASE_LISTENER_EXIT_CODE' \
                'signal|RELEASE_LISTENER_SIGNAL_NAME' \
                'last finalize marker|RELEASE_LAST_FINALIZE_MARKER' \
                '.env.pending|RELEASE__ENV_PENDING' \
                '.env|RELEASE__ENV' \
                'installed.lock|RELEASE_STORAGE_APP_PRIVATE_INSTALLED_LOCK' \
                'PHP version|RELEASE_PHP_VERSION' \
                'SQLite runtime|RELEASE_SQLITE_RUNTIME' \
                'Laravel framework|RELEASE_LARAVEL_FRAMEWORK'; do
                label="${spec%%|*}"
                key="${spec#*|}"
                echo "| $label | $(value_from_log "$known_log" "$key") | $(value_from_log "$current_log" "$key") |"
              done
            } > "$summary_path"
          fi

          cat "$summary_path"
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Require the historical comparison and current browser installer
        if: always()
        run: |
          echo "KNOWN_GOOD_HTTP_SMOKE_STEP_OUTCOME=${{ steps.known-good-http-smoke.outcome }}"
          echo "CURRENT_HTTP_SMOKE_STEP_OUTCOME=${{ steps.current-http-smoke.outcome }}"
          echo "CURRENT_HTTP_REPEAT_STEP_OUTCOME=${{ steps.current-http-repeat.outcome }}"
          echo "RELEASE_DUSK_STEP_OUTCOME=${{ steps.release-dusk.outcome }}"
          test "${{ steps.known-good-http-smoke.outcome }}" = success
          test "${{ steps.current-http-smoke.outcome }}" = success
          if [[ "${{ steps.current-http-repeat.outcome }}" != skipped ]]; then
            test "${{ steps.current-http-repeat.outcome }}" = success
          fi
          test "${{ steps.release-dusk.outcome }}" = success

      - name: Upload CloudPanel installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cloudpanel-installer-diagnostics
          path: |
            ${{ runner.temp }}/assestme-release-dusk.*/storage/logs/release-server.log
            ${{ runner.temp }}/known-good-http.log
            ${{ runner.temp }}/current-http-*.log
            ${{ runner.temp }}/boundary-http.log
            ${{ runner.temp }}/release-http-summary.md
            ${{ runner.temp }}/http-known-good/assestme/storage/logs/laravel.log
            ${{ runner.temp }}/http-current-*/assestme/storage/logs/laravel.log
            ${{ runner.temp }}/http-boundary/assestme/storage/logs/laravel.log
            ${{ runner.temp }}/release-dusk/assestme/storage/logs/laravel.log
            tests/Browser/screenshots
            tests/Browser/source
            tests/Browser/console
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated installable release
        uses: actions/upload-artifact@v6
        with:
          name: assestme-ci-release
          path: ${{ runner.temp }}/release/assestme-ci.zip
          if-no-files-found: error
          retention-days: 7

  clean-checkout-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_FALLBACK_LOCALE: it
      APP_LOCALE: it
      APP_TIMEZONE: Europe/Rome
      ASSESTME_BACKUP_ROOT: ${{ github.workspace }}/backups
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      DEV_ADMIN_NAME: CI Administrator
      DEV_ADMIN_EMAIL: admin@assestme.local
      DEV_ADMIN_PASSWORD: CI-Only!AssestMe-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sockets, sqlite3, xml, zip
          ini-values: memory_limit=512M
          tools: composer:v2

      - name: Install WeasyPrint runtime
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils weasyprint

      - name: Bootstrap a clean checkout
        run: scripts/bootstrap-local.sh "${GITHUB_WORKSPACE}"

      - name: Verify bootstrapped application
        run: |
          php artisan assestme:diagnose
          test "$(php artisan tinker --execute='echo App\Models\User::query()->count();')" = "1"
          test "$(php artisan tinker --execute='echo App\Models\Category::query()->count();')" = "18"
          test "$(php artisan tinker --execute='echo App\Models\Assessment::query()->count();')" = "0"
          test "$(php artisan tinker --execute='echo App\Models\FindingTemplate::query()->count();')" -gt "0"

  publish-develop-release:
    name: Publish develop release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    needs:
      - quality
      - database-compatibility
      - cloudpanel-release
      - clean-checkout-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: assestme-develop-release
      cancel-in-progress: true

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download validated release artifact
        uses: actions/download-artifact@v7
        with:
          name: assestme-ci-release
          path: dist

      - name: Prepare stable develop asset
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dist/assestme-ci.zip
          install -m 0644 dist/assestme-ci.zip dist/assestme-develop.zip
          test -s dist/assestme-develop.zip

          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '*.zip' -print | sort)

          if [[ "${#archives[@]}" -ne 2 ]]; then
              printf 'Expected the CI archive and the renamed develop archive, found %s.\n' \
                  "${#archives[@]}" >&2
              printf '%s\n' "${archives[@]}" >&2
              exit 1
          fi

          if find dist -type f -name '*.sha256' -print -quit | grep -q .; then
              printf 'Unexpected external SHA-256 sidecar found in the release artifact.\n' >&2
              find dist -type f -name '*.sha256' -print >&2
              exit 1
          fi

      - name: Confirm this is still the latest develop commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --no-tags --depth=1 origin develop
          latest_develop_sha="$(git rev-parse origin/develop)"

          if [[ "$GITHUB_SHA" != "$latest_develop_sha" ]]; then
              printf 'Refusing to publish obsolete commit %s; develop is now %s.\n' \
                  "$GITHUB_SHA" "$latest_develop_sha" >&2
              exit 1
          fi

      - name: Publish rolling develop prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          release_tag='develop-latest'
          release_title='AssestMe develop — ultima build valida'
          release_asset='dist/assestme-develop.zip'
          short_sha="${GITHUB_SHA:0:7}"

          cat > release-notes.md <<EOF
          Build automatica validata del branch \`develop\`.

          - Commit: \`${GITHUB_SHA}\`
          - Commit breve: \`${short_sha}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Il file \`assestme-develop.zip\` è il pacchetto installabile prodotto e verificato dal job \`cloudpanel-release\`.

          Questa è una prerelease di sviluppo. Non sostituisce una release stabile versionata.
          EOF

          if gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$release_tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --cleanup-tag \
                  --yes
          else
              gh api \
                  --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                  >/dev/null 2>&1 || true
          fi

          gh release create "$release_tag" \
              "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file release-notes.md \
              --prerelease

  deploy_cloudpanel:
    name: Deploy CloudPanel CI
    needs:
      - publish-develop-release
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/develop' &&
        success()
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: assestme-cloudpanel-ci
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CLOUDPANEL_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "CLOUDPANEL_SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          }

          test -n "$SSH_KNOWN_HOSTS" || {
            echo "CLOUDPANEL_KNOWN_HOSTS is not configured." >&2
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/cloudpanel_deploy"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/cloudpanel_deploy" \
            "$HOME/.ssh/known_hosts"

      - name: Deploy develop to CloudPanel
        shell: bash
        env:
          CLOUDPANEL_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          CLOUDPANEL_PORT: ${{ secrets.CLOUDPANEL_PORT }}
          CLOUDPANEL_USER: ${{ secrets.CLOUDPANEL_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$CLOUDPANEL_HOST" || {
            echo "CLOUDPANEL_HOST is not configured." >&2
            exit 1
          }

          test -n "$CLOUDPANEL_PORT" || {
            echo "CLOUDPANEL_PORT is not configured." >&2
            exit 1
          }

          test -n "$CLOUDPANEL_USER" || {
            echo "CLOUDPANEL_USER is not configured." >&2
            exit 1
          }

          ssh \
            -p "$CLOUDPANEL_PORT" \
            -i "$HOME/.ssh/cloudpanel_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$CLOUDPANEL_USER@$CLOUDPANEL_HOST"
