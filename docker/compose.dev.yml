services:
  app:
    build:
      context: dev
      dockerfile: Dockerfile
    working_dir: /workspace
    init: true
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
      - --no-reload
    environment:
      APP_URL: http://127.0.0.1:8000
      ASSESTME_GID: "${GID:-}"
      ASSESTME_BACKUP_ROOT: /workspace/backups
      ASSESTME_VERIFY_RUNTIME: docker-compose-dev
      ASSESTME_UID: "${UID:-}"
      DB_DATABASE: /workspace/database/database.sqlite
      DUSK_BROWSER_HOST: assestme-app
      DUSK_DRIVER_URL: http://selenium:4444
      DUSK_READY_HOST: 127.0.0.1
      DUSK_SERVER_BIND: 0.0.0.0
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      LARAVEL_PDF_DRIVER: weasyprint
      LARAVEL_PDF_WEASYPRINT_BINARY: /usr/bin/weasyprint
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        aliases:
          - assestme-app
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ../:/workspace
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8000/admin/login
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  selenium:
    image: selenium/standalone-chromium:4.46.0-20260707
    profiles:
      - browser
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - /opt/bin/check-grid.sh
        - --host
        - 0.0.0.0
        - --port
        - "4444"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql-test:
    image: "${ASSESTME_MYSQL_TEST_IMAGE:-mysql:8.4.11}"
    profiles:
      - database
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: assestme_test
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=127.0.0.1
        - --user=root
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb-test:
    image: "${ASSESTME_MARIADB_TEST_IMAGE:-mariadb:12.3.2}"
    profiles:
      - database
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: assestme_test
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
