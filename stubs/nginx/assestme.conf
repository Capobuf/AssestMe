# Replace every __ASSESTME_*__ placeholder before enabling this configuration.
# Certbot adds the TLS listener and certificate directives to this server block.
# The scheme-aware redirect remains valid after that transformation.
server {
    listen 80;
    listen [::]:80;
    server_name __ASSESTME_HOSTNAME__;

    server_tokens off;

    root __ASSESTME_PUBLIC_ROOT__;
    index index.php;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass __ASSESTME_PHP_FPM_ENDPOINT__;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ^~ /database/ {
        deny all;
    }

    location ^~ /storage/ {
        deny all;
    }

    location ^~ /vendor/ {
        deny all;
    }

    location ^~ /tests/ {
        deny all;
    }

    location ^~ /bootstrap/ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:bak|conf|env|ini|lock|log|md|phar|sql|sqlite3?|ya?ml)$ {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/assestme.access.log;
    error_log /var/log/nginx/assestme.error.log;
}
