# Replace __ASSESTME_HOSTNAME__ before enabling this configuration.
server {
    listen 80;
    listen [::]:80;
    server_name __ASSESTME_HOSTNAME__;

    root /var/www/assestme/current/public;
    index index.php;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(database|storage|vendor|tests|bootstrap/cache)/ {
        deny all;
    }

    location ~* \.(?:env|sqlite|sqlite3|log|ini|lock|json|ya?ml|md)$ {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/assestme.access.log;
    error_log /var/log/nginx/assestme.error.log;
}
